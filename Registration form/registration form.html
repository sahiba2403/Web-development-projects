<html>
    <head>
        <title> Registration form</title>
    </head> 
    <body bgcolor="white">
       <h1 align="center">Registration Form</h1>
       <form method="post" Action="registration form.html">
        First Name<input type="text" name="First name" max length="35" size=20
        placeholder="Enter first name"><br/>
        Last name<input type="text" name="last name"max length="35"size=20
        placeholder="enter last name"><br/>
        Email  <input type="email"name="email" maxlength="35" size=30
        placeholder="enter email"><br/>
        Password:<input type="text"name="password" maxlength="35" size=30><br/>
        Gender:<br/>male<input type="radio"name="r1" value="male"><br/>
             female<input type="radio" name="r1" value="female"><br/>
             other<input type="radio" name="r1"   value="other"><br/>
        Age:<select>
            <option>select age</option>
            <option value="16">16</option>
            <option value="17">17</option>
        </select><br/>
        preferences:<br/>acrylic painting<input type="checkbox" name="c1" value="acrylic painting"><br/>
                    oil painting<input type="checkbox" name="c2" value="oil painting"><br/>

       select occupation:<select>
        <option>student</option>
        <option value="student">student</option>
        <option value="worker">worker</option>
       </select><br/>
       Bio:<textarea rows="10" cols="30">

       </textarea><br/>
       <input type="button"value="submit">
       <input type="button" value="reset"

       </form>
    

</body>
</html>
